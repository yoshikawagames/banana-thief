<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バナナを盗んで食え（超スロー版）</title>
    <!-- Tailwind CSSを読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=M+PLUS+Rounded+1c:wght@700;900&display=swap');
        
        body {
            font-family: 'M PLUS Rounded 1c', 'Press Start 2P', sans-serif;
            background-color: #f0f0f0;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            border: 3px solid #333;
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://raw.githubusercontent.com/yoshikawagames/banana-thief/main/%E3%83%90%E3%83%8A%E3%83%8A%E6%B3%A5%E6%A3%92%E8%83%8C%E6%99%AF%EF%BC%92.png'); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat; 
            background-color: #228B22; 
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
            max-width: 100%;
            display: block;
            border-radius: 12px;
        }

        .pixel-art {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #game-title {
            font-size: 1.5rem;
        }
        @media (min-width: 768px) {
            #game-title {
                font-size: 2.2rem;
            }
        }

        .btn-green {
            background: linear-gradient(180deg, #10B981 0%, #059669 100%);
            border: 2px solid #065F46;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            box-shadow: 0 4px 0 #065F46;
        }
        .btn-green:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #065F46;
        }

        .btn-red {
            background: linear-gradient(180deg, #EF4444 0%, #DC2626 100%);
            border: 2px solid #991B1B;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            box-shadow: 0 4px 0 #991B1B;
        }
        .btn-red:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #991B1B;
        }

        .rhythm-lane-btn {
            padding: 1.5rem 2.5rem;
            border-radius: 0.75rem;
            font-size: 1.8rem; 
            font-weight: bold;
            color: white;
            transition: transform 0.1s;
            touch-action: none;
            box-shadow: 0 4px 0 #B45309;
        }
        .rhythm-lane-btn:active {
            transform: scale(0.92);
            box-shadow: none;
        }

        /* リズム判定メッセージのスタイル */
        #hit-grade-display {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.8rem;
            font-weight: 900;
            color: #FACC15;
            text-shadow: 3px 3px 0 #000, -2px -2px 0 #000;
            pointer-events: none; 
            opacity: 0;
            transition: opacity 0.15s ease-out, transform 0.15s ease-out;
            z-index: 20;
        }

        /* スコアリングメッセージのオーバーレイ */
        #game-message-overlay {
            background-color: rgba(0, 0, 0, 0.75); 
            border-radius: 0.75rem;
        }
        
        /* ジョイスティックコンテナ (iPad/スマホ対応) */
        #joystick-container {
            position: absolute; 
            bottom: 15px; 
            right: 15px; 
            width: 130px; 
            height: 130px; 
            display: block; 
            border: 2px dashed rgba(239, 68, 68, 0.6); 
            border-radius: 50%;
            z-index: 15;
            pointer-events: auto; 
            background: rgba(0, 0, 0, 0.15);
            touch-action: none;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 md:p-4 bg-slate-800 text-slate-100">
    <div class="flex flex-col items-center p-4 md:p-6 bg-slate-900 rounded-2xl shadow-2xl border-4 border-amber-500 max-w-xl w-full">
        <h1 id="game-title" class="text-2xl md:text-3xl text-amber-400 font-extrabold mb-3 text-center tracking-wider" style="text-shadow: 2px 2px 0 #000">バナナを盗んで食え★超スロー</h1>

        <!-- ゲーム説明とタイトル画面 -->
        <div id="game-intro" class="text-center text-gray-200 mb-4 transition-opacity duration-300">
            <p class="mb-1 text-sm md:text-base">怪盗となり、美術館に展示されたバナナを盗み出せ！</p>
            <p class="mb-3 text-xs md:text-sm text-amber-200">赤矢印の数はそのまま、スピードを極限まで遅くしました！</p>

            <div class="mb-4">
                <label for="difficulty" class="text-amber-300 text-sm font-bold block mb-1">難易度:</label>
                <select id="difficulty" class="p-2 border-2 border-amber-500 rounded-lg bg-slate-800 text-amber-300 font-bold text-center">
                    <option value="ultraslow">超スロー（激甘モード）</option>
                </select>
            </div>

            <button id="startButton" class="btn-green px-6 py-3 rounded-xl text-lg font-black hover:scale-105 transform transition">怪盗開始！</button>
        </div>

        <!-- ゲームキャンバスエリア -->
        <div class="relative w-full flex justify-center items-center my-2">
            <canvas id="gameCanvas" class="w-full h-auto rounded-xl pixel-art"></canvas>

            <!-- スコアリング画面（ゲームオーバー/勝利）のオーバーレイ -->
            <div id="game-message-overlay" class="absolute inset-0 flex flex-col items-center justify-center text-center p-4 z-20 pointer-events-none text-white hidden">
                <h2 id="overlay-title" class="text-3xl md:text-4xl font-black mb-2 text-amber-400" style="text-shadow: 3px 3px 0 #000;"></h2>
                <p id="overlay-subtitle" class="text-lg md:text-xl font-bold"></p>
            </div>

            <!-- リズムゲームの説明画面 -->
            <div id="rhythm-intro-container" class="hidden absolute inset-0 flex flex-col items-center justify-center p-4 bg-slate-950/85 rounded-xl z-20">
                <p class="text-amber-300 font-bold mb-4 text-center p-3 bg-slate-900 border border-amber-500 rounded-lg text-sm md:text-base">
                    バナナに到達！<br>上から降ってくるノーツが下の黄色いゾーンに来たら、下の対応するボタンを押して召し上がれ！
                </p>
                <button id="rhythmStartButton" class="btn-green p-3 px-8 rounded-xl text-lg font-bold hover:scale-105 transition">いただきます！</button>
            </div>

            <!-- リズムゲームの判定表示エリア -->
            <div id="hit-grade-display">PERFECT!</div>

            <!-- ジョイスティックコンテナ (モバイル/iPad対応) -->
            <div id="joystick-container" class="hidden"></div>
        </div>

        <!-- ゲーム中のUI要素 -->
        <div id="game-ui" class="mt-3 hidden w-full text-center">
            <!-- 勝利条件: バナナを食べるボタン -->
            <div id="eat-banana-container" class="hidden flex flex-col items-center">
                <p id="eat-count-display" class="text-base md:text-lg mb-2 text-amber-300 font-bold">食べたバナナ... 0/10</p>
                <p id="rhythm-life-display" class="text-sm mb-2 text-red-400 font-bold"></p>

                <div id="rhythm-game-container" class="flex justify-center gap-3 mt-1">
                    <button id="laneButtonLeft" class="rhythm-lane-btn bg-amber-500 hover:bg-amber-600 focus:bg-amber-700">←</button>
                    <button id="laneButtonCenter" class="rhythm-lane-btn bg-amber-500 hover:bg-amber-600 focus:bg-amber-700">・</button>
                    <button id="laneButtonRight" class="rhythm-lane-btn bg-amber-500 hover:bg-amber-600 focus:bg-amber-700">→</button>
                </div>
            </div>

            <!-- リトライボタン -->
            <button id="retryButton" class="btn-red px-6 py-3 mt-3 rounded-xl text-lg font-bold hover:scale-105 transition hidden">もう一度挑戦</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            // UI要素を取得
            const startButton = document.getElementById('startButton');
            const retryButton = document.getElementById('retryButton');
            const gameIntro = document.getElementById('game-intro');
            const gameUI = document.getElementById('game-ui');
            const gameMessageOverlay = document.getElementById('game-message-overlay'); 
            const overlayTitle = document.getElementById('overlay-title');
            const overlaySubtitle = document.getElementById('overlay-subtitle');
            const eatBananaContainer = document.getElementById('eat-banana-container');
            const eatCountDisplay = document.getElementById('eat-count-display');
            const rhythmIntroContainer = document.getElementById('rhythm-intro-container');
            const rhythmStartButton = document.getElementById('rhythmStartButton');
            const rhythmLifeDisplay = document.getElementById('rhythm-life-display');
            const hitGradeDisplay = document.getElementById('hit-grade-display'); 
            const joystickContainer = document.getElementById('joystick-container'); 

            const laneButtonLeft = document.getElementById('laneButtonLeft');
            const laneButtonCenter = document.getElementById('laneButtonCenter');
            const laneButtonRight = document.getElementById('laneButtonRight');

            // 入力状態
            let keys = {};
            let joystick = {
                active: false,
                deltaX: 0, 
                deltaY: 0,
                radius: 45, 
                innerRadius: 20 
            };
            const JOYSTICK_DEADZONE = 5; 

            let animationFrameId;
            let startTime;
            let endTime;

            // ゲーム状態: 'title', 'playing', 'rhythmIntro', 'rhythmPlaying', 'gameOver', 'cleared'
            let gameState = 'title'; 
            let player = { x: 0, y: 0, size: 22, speed: 5 };

            // BGM関連
            let gameBGM = new Audio('https://raw.githubusercontent.com/yoshikawagames/banana-thief/main/bananasong.mp3');
            gameBGM.loop = true;

            const banana = { x: 0, y: 0, width: 32, height: 64 };
            const eatMax = 10; 
            let eatenCount = 0;

            const guards = [
                { x: 0, y: 0, size: 30, color: '#3B82F6' },
                { x: 0, y: 0, size: 30, color: '#3B82F6' }
            ];
            const visitors = [
                { x: 0, y: 0, size: 20, color: '#9CA3AF' },
                { x: 0, y: 0, size: 20, color: '#9CA3AF' },
                { x: 0, y: 0, size: 20, color: '#9CA3AF' }
            ];
            let bullets = []; 
            
            // ★ 超スロースピードの設定 (本来の2.0/1.5から0.4へ劇的ダウン！) ★
            let bulletSpeed = 0.4; 
            let bulletInterval = 50; // 発射数はそのまま
            let visitorBulletInterval = 120;
            let visitorBulletDirection = []; 
            let frameCount = 0;
            const bulletSize = 12;
            let initialBulletFired = false;

            let gameFlashTimer = 0; 

            // --- リズムゲーム変数 ---
            let rhythmNotes = [];
            const RHYTHM_NOTE_SPEED = 2.0; 

            const hitZoneHeight = 50;
            let rhythmHitZoneY; 
            const hitZoneColor = 'rgba(250, 204, 21, 0.4)';
            const rhythmLanes = ['left', 'center', 'right'];
            let rhythmGameMisses = 0;
            const rhythmMaxMisses = 3; 

            // 判定表示用
            let hitGradeTimer = 0;

            function resizeCanvas() {
                const maxWidth = Math.min(window.innerWidth * 0.9, 500);
                canvas.width = maxWidth;
                canvas.height = maxWidth * 1.1; 
                rhythmHitZoneY = canvas.height - 120; 
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // プレイヤーの移動処理
            function movePlayer() {
                let dx = 0;
                let dy = 0;

                if (keys['arrowup'] || keys['w']) dy -= 1;
                if (keys['arrowdown'] || keys['s']) dy += 1;
                if (keys['arrowleft'] || keys['a']) dx -= 1;
                if (keys['arrowright'] || keys['d']) dx += 1;

                if (joystick.active) {
                    const diffX = joystick.deltaX;
                    const diffY = joystick.deltaY;
                    let distance = Math.hypot(diffX, diffY);

                    if (distance > JOYSTICK_DEADZONE) {
                        const displacementRatio = (distance - JOYSTICK_DEADZONE) / (joystick.radius - JOYSTICK_DEADZONE);
                        const scaledRatio = Math.min(1, Math.max(0, displacementRatio)); 

                        dx += (diffX / distance) * scaledRatio;
                        dy += (diffY / distance) * scaledRatio;
                    }
                }

                if (dx !== 0 || dy !== 0) {
                    const length = Math.hypot(dx, dy);
                    if (length > 1) { 
                        dx /= length;
                        dy /= length;
                    }
                    player.x += dx * player.speed;
                    player.y += dy * player.speed;
                }

                player.x = Math.max(player.size / 2, Math.min(canvas.width - player.size / 2, player.x));
                player.y = Math.max(player.size / 2, Math.min(canvas.height - player.size / 2, player.y));
            }

            // ジョイスティックタッチコントロール
            function setupJoystickEvents() {
                const handleTouch = (e) => {
                    if (gameState !== 'playing') return;
                    const rect = joystickContainer.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;

                    const touch = e.touches ? e.touches[0] : e;
                    let dx = touch.clientX - centerX;
                    let dy = touch.clientY - centerY;

                    const dist = Math.hypot(dx, dy);
                    if (dist > joystick.radius) {
                        dx = (dx / dist) * joystick.radius;
                        dy = (dy / dist) * joystick.radius;
                    }

                    joystick.active = true;
                    joystick.deltaX = dx;
                    joystick.deltaY = dy;
                };

                const handleEnd = () => {
                    joystick.active = false;
                    joystick.deltaX = 0;
                    joystick.deltaY = 0;
                };

                joystickContainer.addEventListener('touchstart', (e) => { e.preventDefault(); handleTouch(e); });
                joystickContainer.addEventListener('touchmove', (e) => { e.preventDefault(); handleTouch(e); });
                joystickContainer.addEventListener('touchend', handleEnd);
                joystickContainer.addEventListener('touchcancel', handleEnd);

                joystickContainer.addEventListener('mousedown', handleTouch);
                window.addEventListener('mousemove', (e) => { if (joystick.active) handleTouch(e); });
                window.addEventListener('mouseup', handleEnd);
            }
            setupJoystickEvents();

            // キーボード操作リスナー
            window.addEventListener('keydown', (e) => {
                keys[e.key.toLowerCase()] = true;
                if (gameState === 'rhythmPlaying') {
                    if (e.key === 'ArrowLeft' || e.key === 'a') handleRhythmInput('left');
                    if (e.key === 'ArrowDown' || e.key === 's' || e.key === ' ') handleRhythmInput('center');
                    if (e.key === 'ArrowRight' || e.key === 'd') handleRhythmInput('right');
                }
            });
            window.addEventListener('keyup', (e) => {
                keys[e.key.toLowerCase()] = false;
            });

            function initGame() {
                // スピードは「超スロー(0.4)」に固定！
                bulletSpeed = 0.4; 
                bulletInterval = 50; 
                visitorBulletInterval = 120; 
                player.speed = 5;

                player.x = canvas.width / 2;
                player.y = canvas.height - 50;

                banana.x = canvas.width / 2 - banana.width / 2;
                banana.y = 40;

                guards[0].x = canvas.width / 4; guards[0].y = 90;
                guards[1].x = canvas.width * 3 / 4; guards[1].y = 90;

                visitors[0].x = canvas.width / 6; visitors[0].y = canvas.height / 2;
                visitors[1].x = canvas.width / 2; visitors[1].y = canvas.height / 2.3;
                visitors[2].x = canvas.width * 5 / 6; visitors[2].y = canvas.height / 2;

                bullets = []; 
                rhythmNotes = []; 
                eatenCount = 0;
                rhythmGameMisses = 0; 

                frameCount = 0; 
                initialBulletFired = false; 
                gameFlashTimer = 0; 
                startTime = performance.now();

                visitorBulletDirection = visitors.map(() => {
                    const angle = Math.random() * Math.PI * 2;
                    return { dx: Math.cos(angle), dy: Math.sin(angle) };
                });

                joystickContainer.classList.remove('hidden');
            }

            // --- 弾幕生成 (数と密度は同一、スピードのみ超遅い) ---
            function createInitialBullet() {
                if (frameCount === 30 && !initialBulletFired) {
                    guards.forEach(guard => {
                        const dx = player.x - guard.x;
                        const dy = player.y - guard.y;
                        const angle = Math.atan2(dy, dx);
                        bullets.push({
                            x: guard.x, y: guard.y,
                            dx: Math.cos(angle) * bulletSpeed * 1.5,
                            dy: Math.sin(angle) * bulletSpeed * 1.5,
                            width: bulletSize, height: bulletSize
                        });
                    });
                    initialBulletFired = true;
                }
            }

            function createGuardBulletPattern() {
                if (frameCount % bulletInterval === 0) {
                    const angleStep = (Math.PI * 2) / 10;
                    guards.forEach(guard => {
                        for (let i = 0; i < 10; i++) {
                            const angle = i * angleStep;
                            bullets.push({
                                x: guard.x, y: guard.y,
                                dx: Math.cos(angle) * bulletSpeed,
                                dy: Math.sin(angle) * bulletSpeed,
                                width: bulletSize, height: bulletSize
                            });
                        }
                    });
                }
            }

            function createVisitorBulletPattern() {
                if (frameCount % visitorBulletInterval === 0) {
                    visitors.forEach((visitor, index) => {
                        const dir = visitorBulletDirection[index];
                        bullets.push({
                            x: visitor.x, y: visitor.y,
                            dx: dir.dx * bulletSpeed * 1.2,
                            dy: dir.dy * bulletSpeed * 1.2,
                            width: bulletSize, height: bulletSize
                        });
                    });
                }
            }

            function moveBullets() {
                bullets.forEach(bullet => {
                    bullet.x += bullet.dx;
                    bullet.y += bullet.dy;
                });
                bullets = bullets.filter(b => 
                    b.x > -20 && b.x < canvas.width + 20 &&
                    b.y > -20 && b.y < canvas.height + 20
                );
            }

            function checkCollision() {
                for (const bullet of bullets) {
                    const dx = player.x - (bullet.x + bullet.width / 2);
                    const dy = player.y - (bullet.y + bullet.height / 2);
                    if (Math.hypot(dx, dy) < (player.size / 2 + bullet.width / 2 - 2)) {
                        return true;
                    }
                }
                return false;
            }

            function checkBananaProximity() {
                const dx = player.x - (banana.x + banana.width / 2);
                const dy = player.y - (banana.y + banana.height / 2);
                return Math.hypot(dx, dy) < player.size + 15;
            }

            function generateRhythmNotes() {
                rhythmNotes = []; 
                const noteSpacing = 90; 
                const totalLanes = rhythmLanes.length;

                for (let i = 0; i < eatMax; i++) {
                    const laneIndex = Math.floor(Math.random() * totalLanes);
                    rhythmNotes.push({
                        x: (canvas.width / totalLanes) * (laneIndex + 0.5),
                        y: -100 - (i * noteSpacing),
                        size: 32,
                        lane: rhythmLanes[laneIndex],
                        hit: false
                    });
                }
            }

            function moveRhythmNotes() {
                rhythmNotes.forEach(note => {
                    note.y += RHYTHM_NOTE_SPEED;
                });

                let missed = false;
                rhythmNotes = rhythmNotes.filter(note => {
                    if (!note.hit && note.y > rhythmHitZoneY + hitZoneHeight + 15) {
                        missed = true;
                        return false;
                    }
                    return !note.hit;
                });

                if (missed) {
                    rhythmGameMisses++;
                    showGrade('MISS');
                    rhythmLifeDisplay.innerText = `ミス: ${rhythmGameMisses}/${rhythmMaxMisses}`;
                    if (rhythmGameMisses >= rhythmMaxMisses) {
                        endGame(false, 'バナナを落としてしまった！');
                    }
                }

                if (eatenCount >= eatMax) {
                    endGame(true, 'バナナを完食！ミッション成功！');
                }
            }

            function handleRhythmInput(lane) {
                if (gameState !== 'rhythmPlaying') return;

                const targetNote = rhythmNotes.find(note => 
                    note.lane === lane && 
                    !note.hit && 
                    Math.abs(note.y - (rhythmHitZoneY + hitZoneHeight / 2)) < hitZoneHeight * 1.2
                );

                if (targetNote) {
                    targetNote.hit = true;
                    eatenCount++;
                    eatCountDisplay.innerText = `食べたバナナ... ${eatenCount}/${eatMax}`;
                    showGrade('PERFECT!');
                } else {
                    showGrade('BAD');
                }
            }

            function showGrade(text) {
                hitGradeDisplay.innerText = text;
                hitGradeDisplay.style.opacity = '1';
                hitGradeDisplay.style.transform = 'translate(-50%, -50%) scale(1.2)';
                hitGradeTimer = 30;
            }

            function drawPlayer() {
                const s = player.size / 4; 
                const x = player.x - player.size / 2;
                const y = player.y - player.size / 2;

                ctx.strokeStyle = '#FFFFFF'; 
                ctx.lineWidth = 2; 
                ctx.strokeRect(x - 1, y - 1, player.size + 2, player.size + 2);

                ctx.fillStyle = '#1E293B'; 
                ctx.fillRect(x, y, s * 4, s * 2);
                ctx.fillStyle = '#CBD5E1'; 
                ctx.fillRect(x + s, y + s * 2, s * 2, s * 2);

                ctx.fillStyle = '#0F172A'; 
                ctx.fillRect(x + s, y + s * 4, s * 2, s * 3);
            }

            function drawGuards() {
                guards.forEach(guard => {
                    const x = guard.x - guard.size / 2;
                    const y = guard.y - guard.size / 2;

                    ctx.fillStyle = guard.color;
                    ctx.fillRect(x, y, guard.size, guard.size);
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y, guard.size, guard.size);
                });
            }

            function drawVisitors() {
                visitors.forEach(visitor => {
                    const x = visitor.x - visitor.size / 2;
                    const y = visitor.y - visitor.size / 2;

                    ctx.fillStyle = visitor.color;
                    ctx.fillRect(x, y, visitor.size, visitor.size);
                });
            }

            function drawBanana() {
                ctx.fillStyle = '#FACC15'; 
                ctx.beginPath();
                ctx.ellipse(banana.x + banana.width / 2, banana.y + banana.height / 2, banana.width / 2, banana.height / 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#CA8A04';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            function drawBullets() {
                bullets.forEach(bullet => {
                    ctx.fillStyle = '#EF4444'; 
                    ctx.strokeStyle = '#7F1D1D';
                    ctx.lineWidth = 1.5;

                    // 赤い矢印を描画
                    const angle = Math.atan2(bullet.dy, bullet.dx);
                    ctx.save();
                    ctx.translate(bullet.x, bullet.y);
                    ctx.rotate(angle);

                    ctx.beginPath();
                    ctx.moveTo(bullet.width, 0);
                    ctx.lineTo(-bullet.width / 2, -bullet.height / 2);
                    ctx.lineTo(-bullet.width / 4, 0);
                    ctx.lineTo(-bullet.width / 2, bullet.height / 2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    ctx.restore();
                });
            }

            function drawJoystick() {
                if (!joystickContainer.classList.contains('hidden')) {
                    const rect = joystickContainer.getBoundingClientRect();
                    const canvasRect = canvas.getBoundingClientRect();

                    const scale = canvas.width / canvasRect.width;
                    const cx = (rect.left + rect.width / 2 - canvasRect.left) * scale;
                    const cy = (rect.top + rect.height / 2 - canvasRect.top) * scale;

                    ctx.beginPath();
                    ctx.arc(cx, cy, joystick.radius * scale, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.fill();

                    const kx = cx + joystick.deltaX * scale;
                    const ky = cy + joystick.deltaY * scale;

                    ctx.beginPath();
                    ctx.arc(kx, ky, joystick.innerRadius * scale, 0, Math.PI * 2);
                    ctx.fillStyle = '#FACC15';
                    ctx.fill();
                }
            }

            function drawRhythmGame() {
                // 判定ゾーン
                ctx.fillStyle = hitZoneColor;
                ctx.fillRect(0, rhythmHitZoneY, canvas.width, hitZoneHeight);
                ctx.strokeStyle = '#FACC15';
                ctx.lineWidth = 3;
                ctx.strokeRect(0, rhythmHitZoneY, canvas.width, hitZoneHeight);

                // レーン区切り線
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(canvas.width / 3, 0); ctx.lineTo(canvas.width / 3, canvas.height);
                ctx.moveTo(canvas.width * 2 / 3, 0); ctx.lineTo(canvas.width * 2 / 3, canvas.height);
                ctx.stroke();

                // 降りてくるバナナノーツ
                rhythmNotes.forEach(note => {
                    if (!note.hit) {
                        ctx.fillStyle = '#FACC15';
                        ctx.beginPath();
                        ctx.arc(note.x, note.y, note.size / 2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#854D0E';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                });
            }

            function update() {
                if (hitGradeTimer > 0) {
                    hitGradeTimer--;
                    if (hitGradeTimer === 0) {
                        hitGradeDisplay.style.opacity = '0';
                    }
                }

                if (gameState === 'playing') {
                    frameCount++;
                    movePlayer();
                    createInitialBullet();
                    createGuardBulletPattern();
                    createVisitorBulletPattern();
                    moveBullets();

                    if (checkCollision()) {
                        endGame(false, '警備員の弾幕に当たってしまった！');
                    }

                    if (checkBananaProximity()) {
                        gameState = 'rhythmIntro';
                        rhythmIntroContainer.classList.remove('hidden');
                    }
                } else if (gameState === 'rhythmPlaying') {
                    moveRhythmNotes();
                }
            }

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (gameState === 'playing' || gameState === 'rhythmIntro') {
                    drawBanana();
                    drawVisitors();
                    drawGuards();
                    drawPlayer();
                    drawBullets();
                    drawJoystick();
                } else if (gameState === 'rhythmPlaying') {
                    drawRhythmGame();
                }
            }

            function gameLoop() {
                update();
                render();
                animationFrameId = requestAnimationFrame(gameLoop);
            }

            function endGame(isSuccess, message) {
                gameState = isSuccess ? 'cleared' : 'gameOver';
                endTime = performance.now();
                const clearTime = ((endTime - startTime) / 1000).toFixed(1);

                overlayTitle.innerText = isSuccess ? 'ミッション成功！' : 'ゲームオーバー';
                overlaySubtitle.innerText = message + (isSuccess ? `\nクリアタイム: ${clearTime}秒` : '');
                gameMessageOverlay.classList.remove('hidden');

                eatBananaContainer.classList.add('hidden');
                rhythmIntroContainer.classList.add('hidden');
                retryButton.classList.remove('hidden');
            }

            // イベントバインド
            startButton.addEventListener('click', () => {
                try { gameBGM.play(); } catch(e){}
                gameIntro.classList.add('hidden');
                gameUI.classList.remove('hidden');
                initGame();
                gameState = 'playing';
                gameLoop();
            });

            rhythmStartButton.addEventListener('click', () => {
                rhythmIntroContainer.classList.add('hidden');
                eatBananaContainer.classList.remove('hidden');
                rhythmLifeDisplay.innerText = `ミス: 0/${rhythmMaxMisses}`;
                eatCountDisplay.innerText = `食べたバナナ... 0/${eatMax}`;
                generateRhythmNotes();
                gameState = 'rhythmPlaying';
            });

            laneButtonLeft.addEventListener('click', () => handleRhythmInput('left'));
            laneButtonCenter.addEventListener('click', () => handleRhythmInput('center'));
            laneButtonRight.addEventListener('click', () => handleRhythmInput('right'));

            retryButton.addEventListener('click', () => {
                gameMessageOverlay.classList.add('hidden');
                retryButton.classList.add('hidden');
                cancelAnimationFrame(animationFrameId);
                initGame();
                gameState = 'playing';
                gameLoop();
            });
        };
    </script>
</body>
</html>
